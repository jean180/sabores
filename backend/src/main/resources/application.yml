spring:
  application:
    name: sabores-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sabores_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
    username: ${DB_USER:sabores_user}
    password: ${DB_PASSWORD:sabores_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:c2FiMDByM3NfajB0X3MzY3IzdF9rM3lfZjByX2Rldl9vbmx5X2RvX25vdF91c2VfaW5fcHJvZA==}
    expiration-ms: 86400000  # 24 horas

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sabores: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
